
name: GitHub Actions Practical Lab

on:
  push:
    branches:
      - master
  workflow_dispatch:

jobs:
  conditions_lab:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Display event details
        run: |
          echo "Repository: $GITHUB_REPOSITORY"
          echo "Event: $GITHUB_EVENT_NAME"
          echo "Ref: $GITHUB_REF"

      - name: Run only on master
        if: github.ref == 'refs/heads/main'
        run: echo "This step runs on main"

      - name: Run only on push
        if: github.event_name == 'push'
        run: echo "This step runs for push events"

      - name: Run only on manual trigger
        if: github.event_name == 'workflow_dispatch'
        run: echo "This step runs for manual triggers"

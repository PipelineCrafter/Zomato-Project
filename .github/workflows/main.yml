name: Secure DevSecOps Pipeline 

on: 
  push: 
    branches: 
      - master 
 
jobs: 
  build_and_package: 
    runs-on: ubuntu-slim 

    permissions: 
      actions: read 
      contents: read 
      security-events: write # Required to upload findings to the Security tab 

    steps: 
      - name: Checkout Code 
        uses: actions/checkout@v4 

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: 'javascript-typescript, python' # Comma-separated list of languages
          queries: security-extended 

      - name: Autobuild
        uses: github/codeql-action/autobuild@v3

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v3
        with:
          category: "/language:javascript-typescript"
          
      - name: Cache NPM global directory
        uses: actions/cache@v4
        with:
          path: ~/.npm
          key: ${{ runner.os }}-npm-${{ hashFiles('**/package-lock.json') }}
          restore-keys: |
             ${{ runner.os }}-npm-
             
      - name: BUILD 
        run: npm install 

      - name: TEST 
        run: echo "code is tested!" 

      - name: Artifact upload 
        uses: actions/upload-artifact@v7 
        with: 
          name: artifact-1 
          retention-days: 7
          path: | 
            package* 

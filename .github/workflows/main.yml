
name: Zomato Project CI/CD

on:
  push:
    branches:
      - master
    paths:
      - 'src/**'
      - 'public/**'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/main.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build (${{ matrix.os }}, Node ${{ matrix.node-version }})
    runs-on: ${{ matrix.os }} 
    timeout-minutes: 10
    
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        os: [ubuntu-slim ] 
        node-version: [22]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - name: Install dependencies
        run: npm ci
      
  workflow_check:
    name: Check Workflow Configuration
    runs-on: ubuntu-slim
    timeout-minutes: 2

    steps:
      - name: Verify runner
        run: echo "Workflow check is running successfully"
      - name: Display workflow context
        run: |
          echo "Branch: $GITHUB_REF_NAME"
          echo "Event: $GITHUB_EVENT_NAME"

  post_build_check:
    name: Post-Build Check
    runs-on: ubuntu-slim
    needs: [build, workflow_check]
    if: always()

    steps:
      - name: Confirm prerequisites completed
        run: echo "Build and workflow checks passed."

  
  success_report:
    name: Success Report
    runs-on: ubuntu-slim
    needs: [build, workflow_check, post_build_check]
    if: success()

    steps:
      - name: Report success
        run: echo "All prerequisite jobs succeeded."




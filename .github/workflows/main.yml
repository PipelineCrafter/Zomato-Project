
name: Zomato Project CI/CD

on:
  push:
    branches:
      - master
    paths:
      - 'src/**'
      - 'public/**'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/main.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build React Application
    runs-on: ubuntu-latest
    timeout-minutes: 10
    
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-slim, windows-latest]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build application
        run: npm run build
      

  workflow_check:
    name: Check Workflow Configuration
    runs-on: ${{ matrix.os }}
    timeout-minutes: 2

    steps:
      - name: Verify runner
        run: echo "Workflow check is running successfully"

  post_build_check:
    name: Post-Build Check
    runs-on: ${{ matrix.os }}
    needs: [build, workflow_check]
    if: always()

    steps:
      - name: Confirm prerequisites completed
        run: echo "Build and workflow checks passed."

  
  
  failure_report:
    name: Failure Diagnostic
    runs-on: ${{ matrix.os }}
    needs: [build, workflow_check, post_build_check]
    if: failure()

    steps:
      - name: Report failure
        run: echo "At least one prerequisite job failed."



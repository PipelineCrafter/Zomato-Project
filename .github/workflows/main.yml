
name: Zomato Project CI/CD

on:
  push:
    branches:
      - master
    paths:
      - 'src/**'
      - 'public/**'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/main.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build React Application
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build application
        run: npm run build

  workflow_check:
    name: Check Workflow Configuration
    runs-on: ubuntu-latest
    timeout-minutes: 2

    steps:
      - name: Verify runner
        run: echo "Workflow check is running successfully"

  post_build_check:
    name: Post-Build Check
    runs-on: ubuntu-slim
    needs: [build, workflow_check]

    steps:
      - name: Confirm prerequisites completed
        run: echo "Build and workflow checks passed."

  
  success_report:
    name: Success Report
    runs-on: ubuntu-slim
    needs: [build, workflow_check, post_build_check]
    if: success()

    steps:
      - name: Report success
        run: echo "All prerequisite jobs succeeded."


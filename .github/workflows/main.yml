
name: Zomato Project CI/CD

on:
  push:
    branches:
      - master
    paths:
      - 'src/**'
      - 'public/**'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/main.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: zomato-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  
  build:
    name: Build (${{ matrix.os }}, Node ${{ matrix.node-version }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10

    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        os: [ubuntu-latest]
        node-version: [22]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build application
        run: npm run build
        
      - name: Upload React build artifact
        uses: actions/upload-artifact@v4
        with:
          name: zomato-react-build
          path: build/
          if-no-files-found: error
          retention-days: 7
  
  verify_artifact:
    name: Verify Build Artifact
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Download React build artifact
        uses: actions/download-artifact@v4
        with:
          name: zomato-react-build
          path: downloaded-build/

      - name: Verify downloaded files
        run: |
          echo "Checking downloaded React build..."
          test -f downloaded-build/index.html
          echo "Artifact verification succeeded."
          ls -la downloaded-build/
    
  workflow_check:
    name: Check Workflow Configuration
    runs-on: ubuntu-latest
    timeout-minutes: 2
    outputs:
      build_label: ${{ steps.metadata.outputs.build_label }}

    steps:
      - name: Verify runner
        run: echo "Workflow check is running successfully"
      - name: Display workflow context
        run: |
          echo "Branch: $GITHUB_REF_NAME"
          echo "Event: $GITHUB_EVENT_NAME"
      - name: Run only on push
        if: ${{ github.event_name == 'push' }}
        run: echo "This step runs because the workflow was triggered by a push."
      
      - name: Generate build label
        id: metadata
        run: echo "build_label=zomato-${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"

      - name: Display generated label
        run: echo "Generated label is ${{ steps.metadata.outputs.build_label }}"
      
      - name: Set environment variable
        run: echo "APP_ENV=development" >> "$GITHUB_ENV"

      - name: Read environment variable
        run: echo "Application environment is $APP_ENV"
      - name: Verify GitHub secret is available
        env:
          DEMO_SECRET: ${{ secrets.CI_DEMO_SECRET }}
        run: |
          if [ -n "$DEMO_SECRET" ]; then
            echo "GitHub secret is available."
          else
            echo "GitHub secret is missing."
            exit 1
          fi
 
  post_build_check:
    name: Post-Build Check
    runs-on: ubuntu-latest
    needs: [build, workflow_check]
    if: always()

    steps:
      - name: Confirm prerequisites completed
        run: echo "Prerequisite jobs have completed."

      - name: Display build label from another job
        run: 'echo "Label received: ${{ needs.workflow_check.outputs.build_label }}"'   

  success_report:
    name: Success Report
    runs-on: ubuntu-latest
    needs: [build, workflow_check, post_build_check]
    if: success()

    steps:
      - name: Report success
        run: echo "All prerequisite jobs succeeded."




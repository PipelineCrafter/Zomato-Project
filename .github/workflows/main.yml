name: Secure DevSecOps Pipeline 

on: 
  push: 
    branches: 
      - master 

jobs: 
  build_and_package: 
    runs-on: ubuntu-slim 

    permissions: 
      actions: read 
      contents: read 
      security-events: write # Required to upload findings to the Security tab 

    steps: 
      - name: Checkout Code 
        uses: actions/checkout@v4 

      - name: BUILD 
        run: npm install 

      - name: TEST 
        run: echo "code is tested!" 

      - name: Artifact upload 
        uses: actions/upload-artifact@v7 
        with: 
          name: artifact-1 
          retention-days: 7
          path: | 
            package* 

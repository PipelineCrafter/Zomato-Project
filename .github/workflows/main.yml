
name: GitHub Actions Practical Lab

on:
  push:
    branches:
      - master

jobs:
  runner_lab:
    runs-on: ubuntu-latest
    steps:
      - name: Identify runner
        run: uname -s

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Show files
        run: ls -la

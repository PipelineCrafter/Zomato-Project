
name: GitHub Actions Practical Lab

on:
  push:
    branches:
      - master

jobs:
  status_check_lab:
    runs-on: ubuntu-latest

    steps:
      - name: Step 1 - Successful step
        run: echo "Step 1 succeeded"

      - name: Step 2 - Run on success
        if: success()
        run: echo "Previous steps succeeded"

      - name: Step 3 - Intentional failure
        run: exit 1

      - name: Step 4 - Run on failure
        if: failure()
        run: echo "A previous step failed"

      - name: Step 5 - Always run
        if: always()
        run: echo "This step runs regardless of success or failure"

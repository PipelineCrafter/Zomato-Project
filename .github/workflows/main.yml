name: Secure DevSecOps Pipeline 

on: 
  push: 
    branches: 
      - master 
  workflow_dispatch: 
 
jobs: 
  build_and_package: 
    if: github.ref == 'refs/heads/master' && github.event_name == 'push'
    runs-on: ubuntu-slim 

    permissions: 
      actions: read 
      contents: read 
      security-events: write # Required to upload findings to the Security tab 

    strategy: 
      fail-fast: false 
      matrix: 
        language: ['javascript-typescript'] 


    steps: 
      - name: Checkout Code 
        uses: actions/checkout@v4 
         
      - name: Cache NPM global directory
        uses: actions/cache@v4
        with:
          path: ~/.npm
          key: ${{ runner.os }}-npm-${{ hashFiles('**/package-lock.json') }}
          restore-keys: |
             ${{ runner.os }}-npm-
             
      - name: BUILD 
        run: npm install 

      - name: TEST 
        run: echo "code is tested!" 

      - name: Artifact upload 
        uses: actions/upload-artifact@v7 
        with: 
          name: artifact-1 
          retention-days: 7
          path: | 
            package* 

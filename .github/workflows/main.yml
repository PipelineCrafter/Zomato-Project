name: Secure DevSecOps Pipeline

on:
  push:
    branches:
      - master
  workflow_dispatch:

jobs:
  build_and_package:
    if: github.ref == 'refs/heads/master' && github.event_name == 'push'
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        node-version: [18, 20, 22]
        os:
          - windows-latest
          - ubuntu-latest
        language: 
          - javascript-typescript
          
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Test
        run: echo "test"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: artifact-1
          retention-days: 7
          path: |
            build
            package*.json

      - name: Deployment
        run: echo "app is deployed to container"

      - name: Rollback
        if: failure()
        run: echo "kubectl rollout undo deployment zomato"
